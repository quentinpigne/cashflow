@if (layout.mobile()) {
  <div class="mobile">
    <mat-toolbar class="top">
      <span class="brand">Cashflow</span>
      <span class="spacer"></span>
      <app-notifications />
      <button mat-icon-button [matMenuTriggerFor]="mobileMenu" aria-label="Menu">
        <mat-icon>more_vert</mat-icon>
      </button>
      <mat-menu #mobileMenu>
        <a mat-menu-item routerLink="/reglages"><mat-icon>settings</mat-icon> Réglages</a>
        <a mat-menu-item routerLink="/import"><mat-icon>upload_file</mat-icon> Import</a>
        <button mat-menu-item (click)="logout()"><mat-icon>logout</mat-icon> Déconnexion</button>
      </mat-menu>
    </mat-toolbar>
    <main class="content">
      <router-outlet />
    </main>
    <button mat-fab class="fab" aria-label="Nouvelle transaction" (click)="newTransaction()">
      <mat-icon>add</mat-icon>
    </button>
    <nav class="bottom-nav" aria-label="Navigation principale">
      @for (item of mobileItems; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: item.exact }"
          #rla="routerLinkActive"
          [attr.aria-current]="rla.isActive ? 'page' : null"
        >
          <mat-icon>{{ item.icon }}</mat-icon>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>
  </div>
} @else {
  <mat-sidenav-container class="desktop">
    <mat-sidenav mode="side" opened class="side">
      <div class="side-head">
        <div class="brand side-brand">Cashflow</div>
        <app-notifications />
      </div>
      <button mat-flat-button class="new" (click)="newTransaction()">
        <mat-icon>add</mat-icon>
        Nouvelle transaction
      </button>
      <mat-nav-list>
        @for (item of items; track item.path) {
          <a
            mat-list-item
            [routerLink]="item.path"
            routerLinkActive
            #rla="routerLinkActive"
            [routerLinkActiveOptions]="{ exact: item.exact }"
            [activated]="rla.isActive"
          >
            <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
            <span matListItemTitle>{{ item.label }}</span>
          </a>
        }
      </mat-nav-list>
      <span class="spacer"></span>
      <button mat-button class="logout" (click)="logout()">
        <mat-icon>logout</mat-icon>
        Déconnexion
      </button>
    </mat-sidenav>
    <mat-sidenav-content>
      <main>
        <router-outlet />
      </main>
    </mat-sidenav-content>
  </mat-sidenav-container>
}
