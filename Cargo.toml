[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
cashflow-domain = { path = "crates/domain" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
mod_module_files = "deny"
unwrap_used = "deny"
expect_used = "deny"

# Le hachage argon2id est très lent sans optimisation : on optimise les bibliothèques de cryptographie
# même en développement (connexion en quelques millisecondes au lieu de plusieurs secondes).
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3
