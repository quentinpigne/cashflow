[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
cashflow-domain = { path = "crates/domain" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
mod_module_files = "deny"
unwrap_used = "deny"
expect_used = "deny"
